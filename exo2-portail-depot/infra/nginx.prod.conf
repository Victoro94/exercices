# Proxy TLS prod : termine HTTPS, sert le front, relaie /api et le bucket S3.
# Écoute 80/443 dans le conteneur ; le binding 127.0.0.1 + plage de ports
# se fait dans docker-compose.prod.yml (proxy frontal partagé oblige).
# Certificat au nom fixe /etc/letsencrypt/live/portail/ (certbot --cert-name portail).

upstream backend_app {
  server backend:3000;
}

upstream minio_s3 {
  server minio:9000;
}

server {
  listen 80;
  server_name _;

  # Challenge http-01 : relayé par le proxy frontal via l'en-tête Host.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/portail/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/portail/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  add_header Strict-Transport-Security "max-age=63072000" always;

  # Uploads directs vers MinIO (20 Mo max).
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Bucket S3 exposé en path-style sous le même domaine : les URLs presignées
  # (host = domaine, chemin préservé) restent valides. Le nom doit correspondre
  # à MINIO_BUCKET (défaut deposit-documents).
  location /deposit-documents/ {
    proxy_pass http://minio_s3;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
