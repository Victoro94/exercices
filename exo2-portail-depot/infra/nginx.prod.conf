# Proxy TLS prod : termine HTTPS, sert le front, relaie /api et le bucket S3.
# Écoute 80/443 dans le conteneur ; le binding 127.0.0.1 + plage de ports
# se fait dans docker-compose.prod.yml (proxy frontal partagé oblige).
# Certificat au nom fixe /etc/letsencrypt/live/portail/ (certbot --cert-name portail).

upstream backend_app {
  server backend:3000;
}

upstream minio_s3 {
  server minio:9000;
}

upstream grafana {
  server grafana:3000;
}

# NOTE : pas de blocs upstream "prometheus"/"alertmanager" ici :
# les locations utilisent proxy_pass direct avec port + strip du préfixe
# (http://prometheus:9090/, http://alertmanager:9093/) et nginx refuse
# un port explicite quand l'hôte porte le nom d'un upstream
# ("upstream may not have port").

upstream minio_console {
  server minio:9001;
}

server {
  listen 80;
  server_name _;

  # Challenge http-01 : relayé par le proxy frontal via l'en-tête Host.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/portail/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/portail/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  add_header Strict-Transport-Security "max-age=63072000" always;

  # Uploads directs vers MinIO (20 Mo max).
  client_max_body_size 25m;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Bucket S3 exposé en path-style sous le même domaine : les URLs presignées
  # (host = domaine, chemin préservé) restent valides. Le nom doit correspondre
  # à MINIO_BUCKET (défaut deposit-documents). Ne pas créer de bucket nommé
  # grafana/prometheus/alertmanager/console (réservés aux UIs monitoring).
  location /deposit-documents/ {
    proxy_pass http://minio_s3;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering off;
  }

  # Monitoring exposé sous le même domaine (accès facile, sans tunnel SSH).
  # 1ère couche : basic-auth commune (monitoring.htpasswd, user admin).
  # 2ème couche : logins natifs Grafana (admin/GF_*) et MinIO console.
  # Prometheus/Alertmanager n'ont pas de login natif : seul le basic-auth les garde.
  # Sans slash final, "location /xxx/" ne matche pas et "/" servirait le front
  # SPA : on redirige d'abord vers la forme avec slash.
  location = /grafana { return 301 /grafana/; }
  location = /prometheus { return 301 /prometheus/; }
  location = /alertmanager { return 301 /alertmanager/; }
  location = /minio-console { return 301 /minio-console/; }
  location /grafana/ {
    auth_basic "monitoring";
    auth_basic_user_file /etc/nginx/monitoring.htpasswd;
    proxy_pass http://grafana;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Strip du préfixe (route-prefix=/ côté apps) : l'interne Docker
  # (prometheus:9090, alertmanager:9093, Grafana datasource) reste inchangé.
  location /prometheus/ {
    auth_basic "monitoring";
    auth_basic_user_file /etc/nginx/monitoring.htpasswd;
    proxy_pass http://prometheus:9090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /alertmanager/ {
    auth_basic "monitoring";
    auth_basic_user_file /etc/nginx/monitoring.htpasswd;
    proxy_pass http://alertmanager:9093/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Console MinIO sous /minio-console/ (MINIO_BROWSER_REDIRECT_URL, avec / final
  # obligatoire sinon page blanche). Websocket requis pour la console.
  location /minio-console/ {
    auth_basic "monitoring";
    auth_basic_user_file /etc/nginx/monitoring.htpasswd;
    rewrite ^/minio-console/(.*) /$1 break;
    proxy_pass http://minio_console;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 300;
    chunked_transfer_encoding off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
