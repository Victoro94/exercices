# Stack locale de test : front + back + postgres + minio.
# Usage :
#   cd infra
#   cp ../.env.example ../.env   # puis renseigne les secrets
#   docker compose up --build
# Front : http://localhost:8080 | API : http://localhost:8080/api/health | MinIO : http://localhost:9001
name: portail-depot-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deposit_portal}
      POSTGRES_USER: ${POSTGRES_USER:-deposit_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-deposit_portal}']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-too}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deposit_portal}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-deposit_portal}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3000
      CORS_ORIGINS: http://localhost:8080
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: eu-west-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-too}
      S3_BUCKET: ${MINIO_BUCKET:-deposit-documents}
      DEMO_LAWYER_EMAIL: ${DEMO_LAWYER_EMAIL:-avocat@example.test}
      DEMO_LAWYER_PASSWORD: ${DEMO_LAWYER_PASSWORD:-ChangeMe123!}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # migrate + seed démo (JS compilé, sans ts-node) puis démarrage
    command: ['sh', '-c', 'npx prisma migrate deploy && npm run prisma:seed:prod && node dist/main']

  frontend:
    build: ../frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
