# Stack complète : front + back + postgres + minio + Prometheus + Alertmanager + Grafana.
# Usage one-click : ./install.sh (à la racine) — ou à la main :
#   cd infra
#   cp ../.env.example ../.env   # puis renseigne les secrets
#   docker compose up --build
# Front : http://localhost:8080 | API : http://localhost:8080/api/health | MinIO : http://localhost:9001
# Prometheus : http://localhost:9090 | Alertmanager : http://localhost:9093 | Grafana : http://localhost:3001
name: portail-depot-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deposit_portal}
      POSTGRES_USER: ${POSTGRES_USER:-deposit_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-deposit_portal}']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-too}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # image: nom GHCR (pull sans build via install-registry.sh), build: pour install.sh.
    image: ghcr.io/victoro94/portail-depot-backend:${IMAGE_TAG:-latest}
    build: ../backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deposit_portal}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-deposit_portal}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3000
      CORS_ORIGINS: http://localhost:8080
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: eu-west-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-too}
      S3_BUCKET: ${MINIO_BUCKET:-deposit-documents}
      DEMO_LAWYER_EMAIL: ${DEMO_LAWYER_EMAIL:-avocat@example.test}
      DEMO_LAWYER_PASSWORD: ${DEMO_LAWYER_PASSWORD:-ChangeMe123!}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # migrate + seed démo (JS compilé, sans ts-node) puis démarrage
    command: ['sh', '-c', 'npx prisma migrate deploy && npm run prisma:seed:prod && node dist/main']

  frontend:
    image: ghcr.io/victoro94/portail-depot-frontend:${IMAGE_TAG:-latest}
    build: ../frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - '9090:9090'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - '9093:9093'
    depends_on:
      - alert-sink

  # Sink d'alertes en dev : répond 200 et loggue les webhooks Alertmanager.
  alert-sink:
    image: nginx:alpine
    volumes:
      - ./alert-sink/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafdata:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
      - alertmanager

volumes:
  pgdata:
  miniodata:
  promdata:
  grafdata:
