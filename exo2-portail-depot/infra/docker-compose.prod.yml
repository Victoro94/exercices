# Déploiement prod (serveur partagé) : images GHCR tirées, aucun build,
# aucun code source. Config seule : compose + .env + nginx.
# Requiert dans .env : SUBDOMAIN, LE_EMAIL, HTTP_PORT, HTTPS_PORT.
# Usage : voir infra/README.md (certbot-init.sh d'abord, staging puis prod).
name: portail-depot-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deposit_portal}
      POSTGRES_USER: ${POSTGRES_USER:-deposit_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant (voir .env)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-deposit_portal}']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant (voir .env)}
      MINIO_SERVER_URL: https://${SUBDOMAIN:?SUBDOMAIN manquant}
      MINIO_BROWSER_REDIRECT_URL: https://${SUBDOMAIN:?SUBDOMAIN manquant}/minio-console/
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/victoro94/portail-depot-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deposit_portal}:${POSTGRES_PASSWORD:?manquant}@postgres:5432/${POSTGRES_DB:-deposit_portal}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant (voir .env)}
      PORT: 3000
      CORS_ORIGINS: https://${SUBDOMAIN:?SUBDOMAIN manquant (voir .env)}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${SUBDOMAIN:?SUBDOMAIN manquant}
      S3_REGION: eu-west-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?manquant}
      S3_BUCKET: ${MINIO_BUCKET:-deposit-documents}
      DEMO_LAWYER_EMAIL: ${DEMO_LAWYER_EMAIL:-avocat@example.test}
      DEMO_LAWYER_PASSWORD: ${DEMO_LAWYER_PASSWORD:?DEMO_LAWYER_PASSWORD manquant (voir .env)}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # migrate + seed démo puis démarrage (seed idempotent).
    command: ['sh', '-c', 'npx prisma migrate deploy && npm run prisma:seed:prod && node dist/main']

  frontend:
    image: ghcr.io/victoro94/portail-depot-frontend:${IMAGE_TAG:-latest}
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt:ro
      - web:/var/www/certbot:ro
    ports:
      # 127.0.0.1 uniquement, dans TA plage : le proxy frontal relaie
      # :80 -> HTTP_PORT (Host) et :443 -> HTTPS_PORT (SNI passthrough).
      - '127.0.0.1:${HTTP_PORT:?HTTP_PORT manquant}:80'
      - '127.0.0.1:${HTTPS_PORT:?HTTPS_PORT manquant}:443'
    depends_on:
      backend:
        condition: service_started
      minio:
        condition: service_started
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
      alertmanager:
        condition: service_started
    # Relance spontanée si nginx quitte (course DNS au boot, cert reload, etc.)
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=https://${SUBDOMAIN:?SUBDOMAIN manquant}/prometheus/'
      - '--web.route-prefix=/'
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - promdata:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://${SUBDOMAIN:?SUBDOMAIN manquant}/alertmanager/'
      - '--web.route-prefix=/'
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    depends_on:
      - alert-sink

  alert-sink:
    image: nginx:alpine
    volumes:
      - ./alert-sink/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?manquant}
      GF_SERVER_ROOT_URL: https://${SUBDOMAIN:?SUBDOMAIN manquant}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafdata:/var/lib/grafana

volumes:
  pgdata:
  miniodata:
  promdata:
  grafdata:
  # Noms fixes (indépendants du nom de projet) pour les scripts certbot.
  certs:
    name: portail-certs
  web:
    name: portail-web
