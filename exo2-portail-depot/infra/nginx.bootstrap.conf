# Config temporaire pour l'obtention du 1er certificat : HTTP seul,
# sert les challenges ACME, refuse le reste. Utilisée via
# docker-compose.bootstrap.yml pendant certbot-init.sh uniquement.
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 503;
  }
}
