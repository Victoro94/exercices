# En dev : les alertes partent vers le sink local (logs nginx visibles).
# En prod : ajoutez un receiver Slack/PagerDuty et routez severity=critical dessus.
global:
  resolve_timeout: 5m

route:
  receiver: alert-sink
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: alert-sink
    webhook_configs:
      - url: http://alert-sink/
        send_resolved: true
